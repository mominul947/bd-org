<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud-Powered Free Fire Esports Admin Dashboard</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --primary: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #f59e0b; /* Orange/Gold */
            --danger: #ef4444;
            --success: #10b981;
            --border-color: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar Styling based on Screenshot */
        .sidebar { width: 260px; background-color: #151e2d; padding: 25px 20px; display: flex; flex-direction: column; gap: 10px; border-right: 1px solid var(--border-color); }
        .logo-area { text-align: center; margin-bottom: 25px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; }
        .logo-area h2 { font-size: 1.8rem; color: var(--accent); margin: 0; font-weight: 900; letter-spacing: 1px; }
        .logo-area span { font-size: 0.75rem; color: var(--text-muted); letter-spacing: 2px; text-transform: uppercase; }
        
        .nav-btn { background: #1e293b; color: var(--text-main); border: 1px solid var(--border-color); padding: 12px 15px; border-radius: 6px; text-align: left; cursor: pointer; transition: all 0.2s; font-size: 0.95rem; display: flex; align-items: center; gap: 10px; }
        .nav-btn:hover { background: #27354f; }
        .nav-btn.active { background: #27354f; border-color: var(--primary); box-shadow: inset 3px 0 0 var(--primary); }
        
        /* Sub Menu Design */
        #dynamicSubMenu { display: none; flex-direction: column; gap: 8px; margin-top: 15px; border-top: 1px solid var(--border-color); padding-top: 15px; }
        .sub-menu-title { color: var(--accent); font-size: 0.8rem; font-weight: bold; text-transform: uppercase; margin-bottom: 5px; padding-left: 5px; letter-spacing: 1px; }
        .sub-btn { background: transparent; border: none; color: var(--text-muted); padding: 10px 10px 10px 20px; text-align: left; cursor: pointer; font-size: 0.9rem; border-radius: 6px; display: flex; align-items: center; gap: 8px; }
        .sub-btn:hover, .sub-btn.active { background: rgba(59, 130, 246, 0.1); color: var(--primary); }

        /* Main Content */
        .main-content { flex: 1; padding: 30px; overflow-y: auto; background-color: var(--bg-dark); }
        .section { display: none; }
        .section.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        .card { background-color: var(--card-bg); padding: 25px; border-radius: 8px; margin-bottom: 25px; border: 1px solid var(--border-color); }
        .card-header { font-size: 1.2rem; margin-bottom: 20px; color: white; text-transform: uppercase; border-left: 4px solid var(--primary); padding-left: 10px; }
        
        /* Form Inputs */
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; color: var(--text-muted); font-size: 0.85rem; }
        input[type="text"], input[type="number"], input[type="date"], input[type="time"] { width: 100%; padding: 10px 12px; background-color: #0f172a; border: 1px solid var(--border-color); color: white; border-radius: 6px; outline: none; font-size: 0.95rem; }
        input:focus { border-color: var(--primary); }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }
        
        /* Buttons */
        .btn { padding: 10px 20px; background-color: var(--primary); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-danger { background-color: var(--danger); }
        .btn-success { background-color: var(--success); }
        
        /* Dashboard Widgets */
        .widget-row { display: flex; gap: 20px; margin-bottom: 20px; }
        .widget { flex: 1; background-color: #0f172a; padding: 15px; border-radius: 8px; text-align: center; border: 1px solid var(--border-color); }
        .widget-inner { display: flex; justify-content: center; align-items: center; gap: 5px; margin-top: 10px; }
        .widget input { text-align: center; font-size: 1.5rem; font-weight: bold; background: transparent; color: var(--accent); border: none; width: 60px; padding: 0; outline: none; border-bottom: 2px solid var(--border-color); }
        .widget input:focus { border-color: var(--accent); }
        
        /* Tables */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: center; }
        th { color: var(--accent); font-size: 0.85rem; text-transform: uppercase; border-bottom: 1px solid var(--border-color); font-weight: bold; }
        .live-table tbody tr { border-bottom: 1px solid #1e293b; }
        .live-table input { width: 60px; text-align: center; padding: 8px; background: #0f172a; border: 1px solid var(--border-color); color: white; border-radius: 4px; }
        .team-name-input { width: 100% !important; text-align: left !important; background: transparent !important; border: none !important; pointer-events: none; }
        
        .booyah-tag { background: var(--accent); color: #000; padding: 3px 10px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; display: none; text-transform: uppercase; }
        
        /* Premium Final Point Table (Matches Screenshot 61) */
        .pt-wrapper { display: flex; justify-content: center; background: var(--bg-dark); padding: 20px; }
        .pt-container { background: #0f172a; width: 100%; max-width: 850px; padding: 30px; border-radius: 8px; border: 1px solid var(--accent); box-shadow: 0 0 20px rgba(245, 158, 11, 0.1); }
        
        .pt-header { text-align: center; margin-bottom: 20px; }
        .pt-header h2 { color: var(--accent); font-size: 2rem; text-transform: uppercase; margin: 0; font-weight: bold; letter-spacing: 1px; }
        .pt-header .sub-title { color: white; font-size: 1rem; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; margin-top: 5px; }
        
        .pt-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .pt-table th, .pt-table td { padding: 12px 10px; font-size: 0.95rem; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .pt-table th { color: var(--accent); font-weight: bold; text-transform: uppercase; border-bottom: 1px solid var(--accent); }
        
        .pt-table tbody tr:nth-child(even) { background: rgba(255,255,255,0.02); }
        .pt-table tbody tr:nth-child(1) td { font-weight: bold; color: var(--accent); }
        
        .total-pts-cell { font-weight: bold; color: var(--accent); }
        
        /* Lists */
        .list-item { background-color: #0f172a; padding: 15px; border-radius: 6px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border-color); }
        .list-actions button { margin-left: 10px; padding: 6px 12px; font-size: 0.85rem; }
    </style>
    <!-- Firebase & html2canvas -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCghsS37q-hk21jJfR1_XBlzelMv85ocGc",
            authDomain: "modhu-5e3e9.firebaseapp.com",
            projectId: "modhu-5e3e9",
            storageBucket: "modhu-5e3e9.firebasestorage.app",
            messagingSenderId: "1068529992737",
            appId: "1:1068529992737:web:9b13c43eff8f7515e88f60",
            measurementId: "G-1MKDRB4P79"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentTournamentId = null;
        let currentTourName = "";
        let currentMatchId = null;
        let timerInterval = null;
        let seconds = 0;
        let isTimerRunning = false;

        const defaultPoints = [12, 9, 7, 7, 6, 5, 4, 3, 2, 1, 0, 0];

        // Navigation
        window.switchTab = (tabId, element) => {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.nav-btn, .sub-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            if(element) element.classList.add('active');
            
            if(tabId === 'historySec') loadTournamentsList();
            if(tabId === 'setupSec') document.getElementById('dynamicSubMenu').style.display = 'none';
        };

        // 1. Setup Form Init (Required option removed for team names)
        window.initSetup = () => {
            const pointsDiv = document.getElementById('setupPoints');
            const teamsDiv = document.getElementById('setupTeams');
            pointsDiv.innerHTML = ''; teamsDiv.innerHTML = '';
            
            for(let i=1; i<=12; i++) {
                pointsDiv.innerHTML += `<div class="form-group"><label>#${i}</label><input type="number" id="pt_${i}" value="${defaultPoints[i-1]}"></div>`;
                teamsDiv.innerHTML += `<div class="form-group"><label>Slot ${i}</label><input type="text" id="tm_${i}" placeholder="Optional Team ${i}"></div>`;
            }
        };

        window.saveTournament = async () => {
            const name = document.getElementById('tourName').value;
            const date = document.getElementById('tourDate').value;
            const time = document.getElementById('tourTime').value;
            
            if(!name || !date || !time) return alert("Please fill Tournament Name, Date, and Time.");

            let points = {}, teams = {};
            for(let i=1; i<=12; i++) {
                points[i] = parseInt(document.getElementById(`pt_${i}`).value) || 0;
                teams[i] = document.getElementById(`tm_${i}`).value || ``;
            }
            const data = { name, date, time, points, teams, createdAt: new Date() };

            if(currentTournamentId) {
                await updateDoc(doc(db, "tournaments", currentTournamentId), data);
                currentTournamentId = null;
                document.getElementById('setupSaveBtn').innerText = "Create Tournament";
            } else {
                await addDoc(collection(db, "tournaments"), data);
            }
            document.getElementById('setupForm').reset();
            initSetup();
            switchTab('historySec', document.getElementById('btnTournaments'));
        };

        // 2. History
        window.loadTournamentsList = async () => {
            const list = document.getElementById('tourList');
            list.innerHTML = '<div style="color:var(--text-muted);">Loading...</div>';
            const snapshot = await getDocs(collection(db, "tournaments"));
            list.innerHTML = '';
            
            snapshot.forEach(docSnap => {
                const data = docSnap.data();
                list.innerHTML += `
                    <div class="list-item">
                        <div>
                            <strong style="color: white; font-size:1.1rem;">${data.name}</strong><br>
                            <small style="color: var(--text-muted);">${data.date}</small>
                        </div>
                        <div class="list-actions">
                            <button class="btn" style="background:#475569;" onclick="editTournament('${docSnap.id}')">Edit</button>
                            <button class="btn btn-success" onclick="openMatchManager('${docSnap.id}', '${data.name}')">Enter</button>
                            <button class="btn btn-danger" onclick="deleteTournament('${docSnap.id}')">X</button>
                        </div>
                    </div>
                `;
            });
        };

        window.editTournament = async (id) => {
            const snapshot = await getDocs(collection(db, "tournaments"));
            snapshot.forEach(d => {
                if(d.id === id) {
                    const t = d.data();
                    document.getElementById('tourName').value = t.name;
                    document.getElementById('tourDate').value = t.date;
                    document.getElementById('tourTime').value = t.time;
                    for(let i=1; i<=12; i++) {
                        document.getElementById(`pt_${i}`).value = t.points[i];
                        document.getElementById(`tm_${i}`).value = t.teams[i];
                    }
                    currentTournamentId = id;
                    document.getElementById('setupSaveBtn').innerText = "Update Tournament";
                    switchTab('setupSec', document.getElementById('btnSetup'));
                }
            });
        };
        
        window.deleteTournament = async (id) => {
            if(confirm("Delete this tournament forever?")) {
                await deleteDoc(doc(db, "tournaments", id));
                loadTournamentsList();
            }
        };

        // Sub-menu Trigger
        window.openMatchManager = (tourId, tourName) => {
            currentTournamentId = tourId;
            currentTourName = tourName;
            
            // Show dynamic sub-menu
            document.getElementById('dynamicSubMenu').style.display = 'flex';
            document.getElementById('sideTourName').innerText = tourName;
            document.getElementById('currentTourTitle').innerText = `${tourName} | MATCH LIST`;
            
            switchTab('matchListSec', document.getElementById('btnMatchList'));
            loadMatchesList();
        };

        // 3. Match List
        window.createMatch = async () => {
            const mName = prompt("Enter Match Name (e.g., Match 1):");
            if(!mName) return;
            await addDoc(collection(db, `tournaments/${currentTournamentId}/matches`), {
                matchName: mName, status: 'live', aliveTeams: 12, aliveEnemies: 50, createdAt: new Date()
            });
            loadMatchesList();
        };

        window.loadMatchesList = async () => {
            const list = document.getElementById('matchesListDiv');
            const snapshot = await getDocs(collection(db, `tournaments/${currentTournamentId}/matches`));
            list.innerHTML = '';
            snapshot.forEach(docSnap => {
                const m = docSnap.data();
                const color = m.status === 'completed' ? 'var(--success)' : 'var(--accent)';
                list.innerHTML += `
                    <div class="list-item">
                        <div>
                            <strong style="color:white;">${m.matchName}</strong> 
                            <span style="color:${color}; font-size:0.8rem; margin-left:10px;">[${m.status.toUpperCase()}]</span>
                        </div>
                        <div class="list-actions">
                            <button class="btn btn-success" onclick="startLiveMatch('${docSnap.id}')">Live Panel</button>
                            <button class="btn btn-danger" onclick="deleteMatch('${docSnap.id}')">Delete</button>
                        </div>
                    </div>
                `;
            });
        };

        window.deleteMatch = async (mId) => {
            if(confirm("Delete match?")) {
                await deleteDoc(doc(db, `tournaments/${currentTournamentId}/matches`, mId));
                loadMatchesList();
            }
        };

        // Live Match Panel
        let liveUnsubscribe = null;
        let currentTourData = null;

        window.startLiveMatch = async (mId) => {
            currentMatchId = mId;
            const tSnap = await getDocs(collection(db, "tournaments"));
            tSnap.forEach(d => { if(d.id === currentTournamentId) currentTourData = d.data(); });
            
            switchTab('liveDashboardSec');
            document.getElementById('liveTitle').innerText = `LIVE CONTROL`;
            
            const tbody = document.getElementById('liveTableBody');
            tbody.innerHTML = '';
            for(let i=1; i<=12; i++) {
                tbody.innerHTML += `
                    <tr>
                        <td style="color:var(--text-muted);">#${i}</td>
                        <td><input type="text" id="tname_${i}" value="${currentTourData.teams[i]}" class="team-name-input"></td>
                        <td><input type="number" id="elim_${i}" value="0" oninput="calcRow(${i}); autoSaveLive()"></td>
                        <td><input type="number" id="pos_${i}" value="0" oninput="calcRow(${i}); autoSaveLive()"></td>
                        <td id="tot_${i}" style="font-weight:bold; color:var(--accent);">0</td>
                        <td><span class="booyah-tag" id="boo_${i}">BOOYAH!</span></td>
                    </tr>
                `;
            }

            if(liveUnsubscribe) liveUnsubscribe();
            liveUnsubscribe = onSnapshot(doc(db, `tournaments/${currentTournamentId}/matches`, currentMatchId), (docSnap) => {
                const d = docSnap.data();
                if(!d) return;
                
                if(document.activeElement.id !== 'aliveTms') document.getElementById('aliveTms').value = d.aliveTeams ?? 12;
                if(document.activeElement.id !== 'aliveEnm') document.getElementById('aliveEnm').value = d.aliveEnemies ?? 50;
                
                if(d.teamStats) {
                    for(let i=1; i<=12; i++) {
                        if(document.activeElement.id !== `elim_${i}`) document.getElementById(`elim_${i}`).value = d.teamStats[i]?.elim || 0;
                        if(document.activeElement.id !== `pos_${i}`) document.getElementById(`pos_${i}`).value = d.teamStats[i]?.pos || 0;
                        calcRow(i);
                    }
                }
            });
        };

        window.calcRow = (i) => {
            const elim = parseInt(document.getElementById(`elim_${i}`).value) || 0;
            const pos = parseInt(document.getElementById(`pos_${i}`).value) || 0;
            const posPoint = (pos > 0 && pos <= 12) ? parseInt(currentTourData.points[pos]) : 0;
            
            document.getElementById(`tot_${i}`).innerText = elim + posPoint;
            document.getElementById(`boo_${i}`).style.display = (pos === 1) ? 'inline-block' : 'none';
        };

        window.autoSaveLive = async () => {
            if(!currentMatchId) return;
            const teamStats = {};
            for(let i=1; i<=12; i++) {
                teamStats[i] = {
                    elim: parseInt(document.getElementById(`elim_${i}`).value) || 0,
                    pos: parseInt(document.getElementById(`pos_${i}`).value) || 0
                };
            }
            await updateDoc(doc(db, `tournaments/${currentTournamentId}/matches`, currentMatchId), {
                aliveTeams: parseInt(document.getElementById('aliveTms').value) || 0,
                aliveEnemies: parseInt(document.getElementById('aliveEnm').value) || 0,
                teamStats: teamStats
            });
        };

        window.finalizeMatch = async () => {
            await autoSaveLive();
            await updateDoc(doc(db, `tournaments/${currentTournamentId}/matches`, currentMatchId), { status: 'completed' });
            switchTab('matchListSec', document.getElementById('btnMatchList'));
            loadMatchesList();
        };

        // Timer
        window.toggleTimer = () => {
            if(isTimerRunning) {
                clearInterval(timerInterval);
                document.getElementById('timerBtn').innerText = "START";
            } else {
                timerInterval = setInterval(() => {
                    seconds++;
                    document.getElementById('liveTimer').innerText = `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;
                }, 1000);
                document.getElementById('timerBtn').innerText = "PAUSE";
            }
            isTimerRunning = !isTimerRunning;
        };
        window.resetTimer = () => {
            clearInterval(timerInterval); isTimerRunning = false; seconds = 0;
            document.getElementById('liveTimer').innerText = `00:00`;
            document.getElementById('timerBtn').innerText = "START";
        };

        // 4. Final Point Table
        window.generateFinalTable = async () => {
            if(!currentTournamentId) return;
            switchTab('finalTableSec', document.getElementById('btnFinalTable'));
            document.getElementById('ptTourName').innerText = currentTourName;
            
            const snap = await getDocs(collection(db, `tournaments/${currentTournamentId}/matches`));
            let stats = {};
            for(let i=1; i<=12; i++) stats[i] = { name: currentTourData.teams[i], m: 0, b: 0, pPts: 0, k: 0, tot: 0 };

            snap.forEach(d => {
                const m = d.data();
                if(m.status === 'completed' && m.teamStats) {
                    for(let i=1; i<=12; i++) {
                        const s = m.teamStats[i];
                        if(s) {
                            stats[i].m++;
                            stats[i].k += s.elim;
                            if(s.pos === 1) stats[i].b++;
                            const pts = (s.pos>0 && s.pos<=12) ? parseInt(currentTourData.points[s.pos]) : 0;
                            stats[i].pPts += pts;
                            stats[i].tot += (s.elim + pts);
                        }
                    }
                }
            });

            let sorted = Object.values(stats).sort((a,b) => b.tot - a.tot);
            const tbody = document.getElementById('finalTbody');
            tbody.innerHTML = '';
            sorted.forEach((t, idx) => {
                tbody.innerHTML += `
                    <tr>
                        <td style="color:var(--accent); font-weight:bold;">#${idx+1}</td>
                        <td style="text-align:left;">${t.name}</td>
                        <td>${t.m}</td>
                        <td>${t.b}</td>
                        <td>${t.pPts}</td>
                        <td>${t.k}</td>
                        <td class="total-pts-cell">${t.tot}</td>
                    </tr>
                `;
            });
        };

        window.downloadTableImage = () => {
            const el = document.getElementById('exportTableArea');
            html2canvas(el, { backgroundColor: '#0f172a', scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                link.download = `${currentTourName}_Standings.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        };

        window.onload = () => { initSetup(); switchTab('setupSec', document.getElementById('btnSetup')); };
    </script>
</head>
<body>
    <div class="sidebar">
        <div class="logo-area">
            <h2>BD ORG</h2>
            <span>ADMIN CONTROL</span>
        </div>
        <button class="nav-btn active" id="btnSetup" onclick="switchTab('setupSec', this)">&#10133; 1. Create Setup</button>
        <button class="nav-btn" id="btnTournaments" onclick="switchTab('historySec', this)">&#128340; 2. Tournaments</button>
        
        <div id="dynamicSubMenu">
            <div class="sub-menu-title" id="sideTourName">TOURNAMENT</div>
            <button class="sub-btn" id="btnMatchList" onclick="switchTab('matchListSec', this)">&#9776; 3. Match List</button>
            <button class="sub-btn" id="btnFinalTable" onclick="generateFinalTable()">&#127942; 4. Final Table</button>
        </div>
    </div>

    <div class="main-content">
        <!-- 1. Setup Section -->
        <div id="setupSec" class="section active">
            <div class="card">
                <div class="card-header">CREATE NEW TOURNAMENT</div>
                <form id="setupForm" onsubmit="event.preventDefault(); saveTournament();">
                    <div class="grid-3">
                        <div class="form-group"><label>Tournament Name</label><input type="text" id="tourName" required></div>
                        <div class="form-group"><label>Date</label><input type="date" id="tourDate" required></div>
                        <div class="form-group"><label>Time</label><input type="time" id="tourTime" required></div>
                    </div>
                    <div class="card-header" style="margin-top:20px; font-size:1rem;">POINT DISTRIBUTION (1-12)</div>
                    <div class="grid-3" style="grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));" id="setupPoints"></div>
                    
                    <div class="card-header" style="margin-top:20px; font-size:1rem;">TEAM NAMES (SLOTS 1-12)</div>
                    <div class="grid-3" id="setupTeams"></div>
                    <button type="submit" class="btn" id="setupSaveBtn" style="width: 100%; margin-top: 20px;">Save Setup</button>
                </form>
            </div>
        </div>

        <!-- 2. Tournaments History -->
        <div id="historySec" class="section">
            <div class="card">
                <div class="card-header">ORGANIZED TOURNAMENTS</div>
                <div id="tourList"></div>
            </div>
        </div>

        <!-- 3. Match List -->
        <div id="matchListSec" class="section">
            <div class="card">
                <div class="card-header" id="currentTourTitle">MATCH LIST</div>
                <button class="btn" onclick="createMatch()" style="margin-bottom: 20px;">+ Create Match</button>
                <div id="matchesListDiv"></div>
            </div>
        </div>

        <!-- Live Dashboard -->
        <div id="liveDashboardSec" class="section">
            <div class="card">
                <div class="card-header" id="liveTitle">LIVE CONTROL</div>
                <div class="widget-row">
                    <div class="widget">
                        <label>ALIVE TEAMS</label>
                        <div class="widget-inner">
                            <input type="number" id="aliveTms" value="12" oninput="autoSaveLive()">
                            <span style="font-size: 1.5rem; font-weight: bold; color: var(--text-muted);">/ 12</span>
                        </div>
                    </div>
                    <div class="widget">
                        <label>ALIVE ENEMIES</label>
                        <div class="widget-inner">
                            <input type="number" id="aliveEnm" value="50" oninput="autoSaveLive()">
                        </div>
                    </div>
                    <div class="widget">
                        <label>MATCH TIMER</label>
                        <div style="font-size: 2rem; color: var(--primary); font-weight: bold; margin: 10px 0;" id="liveTimer">00:00</div>
                        <button class="btn" id="timerBtn" onclick="toggleTimer()">START</button>
                        <button class="btn btn-danger" onclick="resetTimer()">RESET</button>
                    </div>
                </div>
                <table class="live-table">
                    <thead><tr><th>Slot</th><th style="text-align:left;">Team Name</th><th>Elims</th><th>Pos</th><th>Total</th><th>Status</th></tr></thead>
                    <tbody id="liveTableBody"></tbody>
                </table>
                <button class="btn btn-success" style="width: 100%; margin-top: 20px;" onclick="finalizeMatch()">Finalize Match</button>
            </div>
        </div>

        <!-- 4. Final Point Table -->
        <div id="finalTableSec" class="section">
            <div style="display:flex; justify-content:flex-end; margin-bottom:15px; max-width: 850px; margin: 0 auto 15px auto;">
                <button class="btn" onclick="downloadTableImage()" style="background: var(--accent); color: #000;">&#11015; Download Image</button>
            </div>
            <div class="pt-wrapper">
                <div id="exportTableArea" class="pt-container">
                    <div class="pt-header">
                        <h2>BD ORG OVERALL RANKING</h2>
                        <div class="sub-title" id="ptTourName">SCRIM 1</div>
                    </div>
                    <table class="pt-table">
                        <thead>
                            <tr>
                                <th>RANK</th>
                                <th style="text-align: left;">TEAM</th>
                                <th>M</th>
                                <th>BOOYAH</th>
                                <th>P. PTS</th>
                                <th>ELIMS</th>
                                <th>TOTAL</th>
                            </tr>
                        </thead>
                        <tbody id="finalTbody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
