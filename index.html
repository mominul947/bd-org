<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud-Powered Free Fire Esports Admin Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500;700;800&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { esports: { bg: '#050B14', card: '#0F172A', accent: '#F59E0B', primary: '#3B82F6' } },
                    fontFamily: { oswald: ['Oswald', 'sans-serif'], inter: ['Inter', 'sans-serif'], rajdhani: ['Rajdhani', 'sans-serif'], }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #050B14; color: #F8FAFC; overflow-x: hidden; }
        .esports-font { font-family: 'Oswald', sans-serif; text-transform: uppercase; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #050B14; }
        ::-webkit-scrollbar-thumb { background: #3B82F6; border-radius: 4px; }
        
        .view-section { display: none; animation: fadeInUp 0.4s ease-out forwards; opacity: 0; transform: translateY(15px); }
        .view-section.active { display: block; }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }

        /* Dashboard UI Elements */
        .glass-panel { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(59, 130, 246, 0.2); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5); }
        .neon-input { background-color: rgba(15, 23, 42, 0.8); border: 1px solid #334155; color: white; transition: all 0.3s ease; }
        .neon-input:focus { border-color: #3B82F6; box-shadow: 0 0 10px rgba(59, 130, 246, 0.5); outline: none; }
        .nav-btn { transition: all 0.3s ease; border: 1px solid transparent; }
        .nav-btn:hover { background: rgba(59, 130, 246, 0.1); border-color: rgba(59, 130, 246, 0.4); box-shadow: 0 0 15px rgba(59, 130, 246, 0.2); }
        .nav-btn.active-nav { background: linear-gradient(90deg, #1D4ED8 0%, #3B82F6 100%); border-color: #60A5FA; box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); color: white; }
        .btn-primary { background: linear-gradient(45deg, #2563EB, #3B82F6); box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4); transition: 0.3s; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6); }
        .btn-accent { background: linear-gradient(45deg, #D97706, #F59E0B); box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4); transition: 0.3s; color: black; }
        .btn-accent:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(245, 158, 11, 0.6); }
        
        .live-table th { background: rgba(15, 23, 42, 0.9); color: #94A3B8; font-size: 0.85rem; text-transform: uppercase; border-bottom: 2px solid #3B82F6; padding: 12px; }
        .live-table td { border-bottom: 1px solid rgba(51, 65, 85, 0.5); padding: 10px; text-align: center; }

        .rush-cb { accent-color: #F59E0B; width: 14px; height: 14px; cursor: pointer; }
        
        /* Champion Rush Highlight CSS */
        .rush-highlight td {
            background-color: rgba(245, 158, 11, 0.25) !important;
            border-top: 1px solid #f59e0b !important;
            border-bottom: 1px solid #f59e0b !important;
        }
        .rush-highlight .team-name-text {
            color: #fcd34d !important;
            text-shadow: 0 0 10px rgba(245, 158, 11, 0.8) !important;
        }

        /* 35 PRO ESPORTS STANDINGS ENGINE - FIXED ALIGNMENT */
        .pt-container {
            background-color: var(--pt-bg); background-image: var(--pt-bg-image, none); background-size: cover; background-position: center;
            border: var(--pt-border-size, 0px) solid var(--pt-border-color, transparent); border-radius: var(--pt-radius, 0px); box-shadow: var(--pt-box-shadow, 0 15px 40px rgba(0,0,0,0.8));
            color: var(--pt-text-color, #fff); position: relative; overflow: hidden; font-family: 'Inter', sans-serif; padding-top: 10px;
        }
        .pt-header { 
            text-align: var(--pt-header-align, center); padding: 25px 20px; 
            border-bottom: var(--pt-header-border-bottom, none); background: var(--pt-header-bg, transparent); 
            position: relative; display: flex; flex-direction: column; justify-content: center;
        }
        .pt-header-title { 
            color: var(--pt-title-color); font-size: var(--pt-title-size, 3.2rem); margin: 0; padding-top: 10px;
            letter-spacing: var(--pt-title-spacing, 2px); text-shadow: var(--pt-title-shadow, none); 
            font-weight: 700; line-height: 1.2; font-family: 'Oswald', sans-serif; text-transform: uppercase;
        }
        .pt-header-sub { 
            color: var(--pt-sub-color); font-size: var(--pt-sub-size, 1.2rem); letter-spacing: var(--pt-sub-spacing, 6px); 
            margin-top: 5px; font-weight: 700; background: var(--pt-sub-bg, transparent); 
            display: inline-block; padding: var(--pt-sub-padding, 0); border-radius: var(--pt-sub-radius, 0);
            text-transform: uppercase; font-family: 'Oswald', sans-serif; text-shadow: var(--pt-sub-shadow, none);
        }
        
        .pt-table-wrap { padding: 20px 25px; }
        
        /* TABLE ALIGNMENT FIX (A to Z Core Fix) */
        .pt-table { 
            width: 100%; 
            border-collapse: collapse !important; 
            border-spacing: 0 !important; 
            table-layout: fixed; /* STRICT COLUMN WIDTHS */
        }
        
        /* STRICT COLUMN SIZING */
        .pt-table th:nth-child(1), .pt-table td:nth-child(1) { width: 8%; }  /* Rank */
        .pt-table th:nth-child(2), .pt-table td:nth-child(2) { width: 44%; text-align: left; padding-left: 15px !important; } /* Team */
        .pt-table th:nth-child(3), .pt-table td:nth-child(3) { width: 8%; }  /* M */
        .pt-table th:nth-child(4), .pt-table td:nth-child(4) { width: 10%; } /* WWCD */
        .pt-table th:nth-child(5), .pt-table td:nth-child(5) { width: 10%; } /* P.PTS */
        .pt-table th:nth-child(6), .pt-table td:nth-child(6) { width: 10%; } /* ELIMS */
        .pt-table th:nth-child(7), .pt-table td:nth-child(7) { width: 10%; } /* TOTAL */

        .pt-table th { 
            font-size: var(--pt-th-size, 0.95rem); color: var(--pt-th-color); background: var(--pt-th-bg, transparent); 
            text-transform: uppercase; letter-spacing: 1.5px; border-bottom: var(--pt-th-border, none); 
            font-weight: 700; vertical-align: middle; padding: 12px 5px; text-align: center;
        }
        .pt-table td { 
            font-size: 1.1rem; text-align: center; background: var(--pt-td-bg, transparent); 
            border-bottom: var(--pt-td-border, none); border-top: var(--pt-td-border-top, none); 
            transition: 0.3s; vertical-align: middle; padding: 8px 5px; height: 45px;
        }

        .pt-rank-col { font-family: 'Rajdhani', sans-serif; font-size: var(--pt-rank-size, 1.5rem); font-weight: 700; color: var(--pt-rank-color) !important; background: var(--pt-rank-bg, transparent); border-right: 2px solid rgba(255, 255, 255, 0.1); }
        
        .pt-team-col { 
            vertical-align: middle;
            color: var(--pt-team-color) !important; 
        }

        /* LOGO & NAME WRAPPER (Prevents black gap bug) */
        .team-wrapper {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            max-width: 100%;
        }
        .team-logo {
            width: 26px;
            height: 26px;
            object-fit: contain;
            border-radius: 4px;
            background-color: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.2);
            flex-shrink: 0;
        }
        .team-name-text {
            font-weight: 800; 
            font-size: var(--pt-team-size, 1.25rem); 
            letter-spacing: 0.5px; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis;
        }
        
        .pt-stat-col { font-family: 'Rajdhani', sans-serif; font-weight: 600; font-size: var(--pt-stat-size, 1.3rem); color: var(--pt-stat-color); }
        .pt-booyah-col { color: var(--pt-booyah-color) !important; font-weight: 700; font-family: 'Rajdhani', sans-serif; font-size: var(--pt-booyah-size, 1.3rem); }
        .pt-total-col { background: var(--pt-total-bg, transparent); color: var(--pt-total-color) !important; font-weight: 800; font-size: var(--pt-total-size, 1.6rem); font-family: 'Rajdhani', sans-serif; border-radius: 4px; padding: 2px 10px; display: inline-block; box-shadow: var(--pt-total-box-shadow, none); text-shadow: var(--pt-total-shadow, none); }
        
        .pt-footer { padding: var(--pt-footer-padding, 15px 25px); text-align: center; font-size: 0.9rem; border-top: var(--pt-footer-border, none); background: var(--pt-footer-bg, transparent); display: flex; justify-content: space-between; align-items: center; font-weight: 600; }

        /* THEMES 1 to 20 (Original) */
        .t-survival { --pt-bg:#09090b; --pt-header-bg:#000; --pt-header-border-bottom:2px solid #ea580c; --pt-title-color:#fff; --pt-title-shadow:2px 2px 0px #ea580c; --pt-sub-color:#ea580c; --pt-sub-bg:#171717; --pt-sub-padding:2px 15px; --pt-wrap-padding:20px 30px; --pt-th-bg:#171717; --pt-th-color:#fdba74; --pt-td-bg:#18181b; --pt-rank-color:#ea580c; --pt-rank-bg:#111; --pt-team-color:#fff; --pt-stat-color:#d4d4d8; --pt-booyah-color:#f97316; --pt-total-bg:#ea580c; --pt-total-color:#fff; --pt-footer-bg:#000; --pt-footer-border:1px solid #27272a; }

        .t-luxray { --pt-bg:#111; --pt-title-color:#f97316; --pt-sub-color:#fff; --pt-header-bg:#000; --pt-wrap-padding:0 10px 20px 10px; --pt-th-bg:#000; --pt-th-color:#f97316; --pt-td-bg:#f97316; --pt-rank-color:#000; --pt-team-color:#000; --pt-stat-color:#000; --pt-booyah-color:#fff; --pt-total-bg:#000; --pt-total-color:#f97316; --pt-footer-bg:#000; }

<body>

    <!-- Point Table Container -->
    <div id="exportTableArea" class="sidebar-container">
        <div class="pt-header">
            <h2 class="pt-header-title" id="ptTourName">Loading...</h2>
            <span class="text-white font-bold text-[11px] bg-red-600 px-2.5 py-1 rounded shadow-[0_0_8px_red]">LIVE</span>
        </div>
        
        <div>
            <table class="pt-table">
                <thead>
                    <tr>
                        <th class="col-rank">#</th>
                        <th class="col-team">TEAM</th>
                        <th class="col-m">M</th>
                        <th class="col-w">WWCD</th>
                        <th class="col-p">PTS</th>
                        <th class="col-k">KILL</th>
                        <th class="col-t">TOTAL</th>
                    </tr>
                </thead>
                <tbody id="finalTbody">
                    <tr><td colspan="7" class="text-center p-4 text-slate-400">Connecting...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, onSnapshot, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const envConfig = {
            apiKey: "AIzaSyCghsS37q-hk21jJfR1_XBlzelMv85ocGc",
            authDomain: "modhu-5e3e9.firebaseapp.com",
            projectId: "modhu-5e3e9",
            storageBucket: "modhu-5e3e9.firebasestorage.app",
            messagingSenderId: "1068529992737",
            appId: "1:1068529992737:web:9b13c43eff8f7515e88f60"
        };
        const app = initializeApp(envConfig); 
        const auth = getAuth(app); 
        const db = getFirestore(app);
        const appId = 'bd-org-esports';

        // OBS AUTO-LOGIN CREDENTIALS
        const OBS_EMAIL = "mominul@gmail.com";
        const OBS_PASSWORD = "mominul";

        async function initOverlay() {
            try {
                const userCredential = await signInWithEmailAndPassword(auth, OBS_EMAIL, OBS_PASSWORD);
                const userId = userCredential.user.uid;

                // Sync Global Tournament Settings (For Logos and Highlights)
                const tournsRef = collection(db, 'artifacts', appId, 'users', userId, 'tournaments');
                
                onSnapshot(tournsRef, (tSnapshot) => {
                    let tournaments = [];
                    tSnapshot.forEach(d => tournaments.push({id: d.id, ...d.data()}));
                    tournaments.sort((a, b) => b.createdAt - a.createdAt);
                    
                    if(tournaments.length === 0) return;
                    const activeTourn = tournaments[0];
                    document.getElementById('ptTourName').innerText = activeTourn.name;

                    const matchesRef = collection(db, 'artifacts', appId, 'users', userId, 'matches');
                    getDocs(matchesRef).then((mSnapshot) => {
                        onSnapshot(matchesRef, (snapshot) => {
                            let matches = [];
                            snapshot.forEach(doc => {
                                if(doc.data().tId === activeTourn.id) {
                                    matches.push({id: doc.id, ...doc.data()});
                                }
                            });
                            generateTable(activeTourn, matches);
                        });
                    });
                });

            } catch (error) {
                document.getElementById('finalTbody').innerHTML = `<tr><td colspan="7" class="text-center text-red-500 p-4">Auth Error</td></tr>`;
            }
        }

        function generateTable(tournament, matches) {
            let currentChamp = tournament.championTeam || "";
            let currentRush = tournament.championRushTeams || [];

            const results = Array.from({length: 12}, (_, i) => ({ 
                teamIdx: i,
                name: (tournament.teams && tournament.teams[i]) ? tournament.teams[i] : `Team ${i+1}`, 
                logo: (tournament.logos && tournament.logos[i]) ? tournament.logos[i] : null,
                matches: 0, booyahs: 0, pPts: 0, elims: 0, total: 0 
            }));

            matches.filter(m => m.status === 'completed').forEach(m => {
                for(let i=0; i<12; i++) {
                    if(m.teamStats && m.teamStats[i]) {
                        const pos = parseInt(m.teamStats[i].pos) || 0;
                        const elims = parseInt(m.teamStats[i].elims) || 0;
                        
                        if(pos > 0 || elims > 0) results[i].matches++;
                        if(pos === 1) results[i].booyahs++;
                        
                        const pPts = (pos >= 1 && pos <= 12) ? tournament.points[pos-1] : 0;
                        results[i].pPts += pPts; 
                        results[i].elims += elims; 
                        results[i].total += (elims + pPts);
                    }
                }
            });

            results.sort((a,b) => b.total - a.total || b.booyahs - a.booyahs || b.elims - a.elims);

            const tbody = document.getElementById('finalTbody'); 
            tbody.innerHTML = '';
            
            results.forEach((team, idx) => {
                let rowClass = idx === 0 ? "rank-1" : idx === 1 ? "rank-2" : idx === 2 ? "rank-3" : "rank-normal";
                let animDelay = idx * 0.07; 

                // Check Highlight Logic
                let isChampion = (team.teamIdx.toString() === currentChamp.toString());
                let isRush = currentRush.includes(team.teamIdx.toString());

                if (isRush) rowClass += " rush-highlight";

                // Generate Logo HTML
                let logoHtml = team.logo ? `<img src="${team.logo}" class="team-logo">` : '';

                // Wrap Logo + Name cleanly without flexbox issues
                let displayTeamName = `<div class="team-wrapper">${logoHtml} <span class="team-name-text">${team.name}</span>`;
                if (isChampion) {
                    displayTeamName += ` <i class="fa-solid fa-crown text-yellow-400 drop-shadow-[0_0_5px_rgba(250,204,21,0.9)] ml-2 text-[1rem]" title="Champion"></i>`;
                }
                displayTeamName += `</div>`;

                tbody.innerHTML += `
                    <tr class="${rowClass} animate-row" style="animation-delay: ${animDelay}s;">
                        <td class="pt-rank-col text-center">${idx + 1}</td>
                        <td class="pt-team-col col-team">${displayTeamName}</td>
                        <td class="text-center opacity-70 text-sm">${team.matches}</td>
                        <td class="text-center text-[#fcd34d]">${team.booyahs}</td>
                        <td class="text-center opacity-80">${team.pPts}</td>
                        <td class="text-center text-white font-bold">${team.elims}</td>
                        <td class="text-center"><span class="pt-total-col">${team.total}</span></td>
                    </tr>
                `;
            });
        }

        initOverlay();
    </script>
</body>
