<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfect Spaced Esports Point Table</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700;800&family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Transparent Background for OBS */
        body { 
            background-color: transparent !important; 
            overflow: hidden; 
            margin: 0;
            padding: 20px;
            font-family: 'Oswald', sans-serif;
        }

        /* Container Width */
        .sidebar-container {
            width: 440px; 
            background: rgba(15, 23, 42, 0.95); 
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-top: 4px solid #f59e0b;
            border-radius: 6px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        /* Header */
        .pt-header { 
            background: linear-gradient(90deg, #f59e0b 0%, #d97706 100%);
            padding: 10px 15px; 
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #fff;
        }
        .pt-header-title { 
            color: #fff; 
            font-size: 1.4rem; 
            font-weight: 800; 
            text-transform: uppercase; 
            margin: 0; 
            letter-spacing: 0.5px;
            text-shadow: 1px 1px 0px rgba(0,0,0,0.6);
        }

        /* Table Styles - Fixed Layout to prevent black boxes */
        .pt-table { 
            width: 100%; 
            border-collapse: collapse !important; 
            border-spacing: 0 !important;
            table-layout: fixed; /* Strictly maintain column sizes */
        }
        
        .pt-table th { 
            background: rgba(0, 0, 0, 0.85); 
            color: #fcd34d; 
            padding: 8px 4px; 
            font-size: 0.75rem; 
            text-transform: uppercase; 
            text-align: center;
            vertical-align: middle;
        }
        
        .pt-table td { 
            padding: 6px 4px; 
            font-size: 1.15rem; 
            color: #e2e8f0; 
            font-weight: 600;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
            vertical-align: middle;
            height: 45px;
        }

        /* Column Widths */
        .col-rank { width: 35px; }
        .col-team { width: auto; text-align: left !important; padding-left: 12px !important; }
        .col-m    { width: 35px; }
        .col-w    { width: 55px; }
        .col-p    { width: 45px; }
        .col-k    { width: 45px; }
        .col-t    { width: 60px; }

        /* Team Name & Logo Wrapper */
        .team-wrapper {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            max-width: 100%;
        }
        
        .team-logo {
            width: 22px;
            height: 22px;
            object-fit: contain;
            border-radius: 4px;
            background-color: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.2);
            flex-shrink: 0;
        }

        .team-name-text {
            color: #ffffff !important;
            font-size: 1.25rem !important; 
            font-weight: 800 !important; 
            text-shadow: 1px 1px 0px #000000; 
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .pt-rank-col { 
            background: rgba(0, 0, 0, 0.5); 
            color: #fbbf24 !important; 
            font-size: 1.2rem !important; 
            font-family: 'Rajdhani', sans-serif !important;
            border-right: 2px solid rgba(255, 255, 255, 0.1);
        }

        .pt-total-col { 
            color: #fff;
            font-weight: 800 !important; 
            font-size: 1.3rem !important; 
            background: rgba(245, 158, 11, 0.25);
            font-family: 'Rajdhani', sans-serif !important;
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* Top 3 Highlighting */
        .rank-1 { background: linear-gradient(90deg, rgba(251, 191, 36, 0.2), transparent); border-left: 4px solid #fbbf24; }
        .rank-2 { background: linear-gradient(90deg, rgba(148, 163, 184, 0.2), transparent); border-left: 4px solid #94a3b8; }
        .rank-3 { background: linear-gradient(90deg, rgba(180, 83, 9, 0.2), transparent); border-left: 4px solid #b45309; }
        .rank-normal { border-left: 4px solid transparent; }

        /* Champion Rush Highlight CSS */
        .rush-highlight td {
            background-color: rgba(245, 158, 11, 0.3) !important;
            border-top: 1px solid #f59e0b !important;
            border-bottom: 1px solid #f59e0b !important;
        }
        .rush-highlight .team-name-text {
            color: #fcd34d !important;
            text-shadow: 0 0 10px rgba(245, 158, 11, 0.8) !important;
        }

        /* Animation */
        @keyframes slideInRight {
            0% { opacity: 0; transform: translateX(30px); }
            100% { opacity: 1; transform: translateX(0); }
        }
        
        .animate-row {
            opacity: 0; 
            animation: slideInRight 0.3s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
    </style>
</head>
<body>

    <!-- Point Table Container -->
    <div id="exportTableArea" class="sidebar-container">
        <div class="pt-header">
            <h2 class="pt-header-title" id="ptTourName">Loading...</h2>
            <span class="text-white font-bold text-[11px] bg-red-600 px-2.5 py-1 rounded shadow-[0_0_8px_red]">LIVE</span>
        </div>
        
        <div>
            <table class="pt-table">
                <thead>
                    <tr>
                        <th class="col-rank">#</th>
                        <th class="col-team">TEAM</th>
                        <th class="col-m">M</th>
                        <th class="col-w">WWCD</th>
                        <th class="col-p">PTS</th>
                        <th class="col-k">KILL</th>
                        <th class="col-t">TOTAL</th>
                    </tr>
                </thead>
                <tbody id="finalTbody">
                    <tr><td colspan="7" class="text-center p-4 text-slate-400">Connecting...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const envConfig = {
            apiKey: "AIzaSyCghsS37q-hk21jJfR1_XBlzelMv85ocGc",
            authDomain: "modhu-5e3e9.firebaseapp.com",
            projectId: "modhu-5e3e9",
            storageBucket: "modhu-5e3e9.firebasestorage.app",
            messagingSenderId: "1068529992737",
            appId: "1:1068529992737:web:9b13c43eff8f7515e88f60"
        };
        const app = initializeApp(envConfig); 
        const auth = getAuth(app); 
        const db = getFirestore(app);
        const appId = 'bd-org-esports';

        // OBS AUTO-LOGIN CREDENTIALS
        const OBS_EMAIL = "mominul@gmail.com";
        const OBS_PASSWORD = "mominul";

        async function initOverlay() {
            try {
                const userCredential = await signInWithEmailAndPassword(auth, OBS_EMAIL, OBS_PASSWORD);
                const userId = userCredential.user.uid;

                const tournsRef = collection(db, 'artifacts', appId, 'users', userId, 'tournaments');
                
                onSnapshot(tournsRef, (tSnapshot) => {
                    let tournaments = [];
                    tSnapshot.forEach(d => tournaments.push({id: d.id, ...d.data()}));
                    tournaments.sort((a, b) => b.createdAt - a.createdAt);
                    
                    if(tournaments.length === 0) return;
                    const activeTourn = tournaments[0];
                    document.getElementById('ptTourName').innerText = activeTourn.name;

                    const matchesRef = collection(db, 'artifacts', appId, 'users', userId, 'matches');
                    getDocs(matchesRef).then((mSnapshot) => {
                        onSnapshot(matchesRef, (snapshot) => {
                            let matches = [];
                            snapshot.forEach(doc => {
                                if(doc.data().tId === activeTourn.id) {
                                    matches.push({id: doc.id, ...doc.data()});
                                }
                            });
                            generateTable(activeTourn, matches);
                        });
                    });
                });

            } catch (error) {
                document.getElementById('finalTbody').innerHTML = `<tr><td colspan="7" class="text-center text-red-500 p-4">Auth Error</td></tr>`;
            }
        }

        function generateTable(tournament, matches) {
            let currentChamp = tournament.championTeam || "";
            let currentRush = tournament.championRushTeams || [];

            const results = Array.from({length: 12}, (_, i) => ({ 
                teamIdx: i,
                name: (tournament.teams && tournament.teams[i]) ? tournament.teams[i] : `Team ${i+1}`, 
                logo: (tournament.logos && tournament.logos[i]) ? tournament.logos[i] : null,
                matches: 0, booyahs: 0, pPts: 0, elims: 0, total: 0 
            }));

            matches.filter(m => m.status === 'completed').forEach(m => {
                for(let i=0; i<12; i++) {
                    if(m.teamStats && m.teamStats[i]) {
                        const pos = parseInt(m.teamStats[i].pos) || 0;
                        const elims = parseInt(m.teamStats[i].elims) || 0;
                        
                        if(pos > 0 || elims > 0) results[i].matches++;
                        if(pos === 1) results[i].booyahs++;
                        
                        const pPts = (pos >= 1 && pos <= 12) ? tournament.points[pos-1] : 0;
                        results[i].pPts += pPts; 
                        results[i].elims += elims; 
                        results[i].total += (elims + pPts);
                    }
                }
            });

            results.sort((a,b) => b.total - a.total || b.booyahs - a.booyahs || b.elims - a.elims);

            const tbody = document.getElementById('finalTbody'); 
            tbody.innerHTML = '';
            
            results.forEach((team, idx) => {
                let rowClass = idx === 0 ? "rank-1" : idx === 1 ? "rank-2" : idx === 2 ? "rank-3" : "rank-normal";
                let animDelay = idx * 0.07; 

                // Check Highlight Logic
                let isChampion = (team.teamIdx.toString() === currentChamp.toString());
                let isRush = currentRush.includes(team.teamIdx.toString());

                if (isRush) rowClass += " rush-highlight";

                // Generate Logo HTML
                let logoHtml = team.logo ? `<img src="${team.logo}" class="team-logo">` : '';

                // Wrap Logo + Name
                let displayTeamName = `<div class="team-wrapper">${logoHtml} <span class="team-name-text">${team.name}</span>`;
                if (isChampion) {
                    displayTeamName += ` <i class="fa-solid fa-crown text-yellow-400 drop-shadow-[0_0_5px_rgba(250,204,21,0.9)] text-[1rem]" title="Champion"></i>`;
                }
                displayTeamName += `</div>`;

                tbody.innerHTML += `
                    <tr class="${rowClass} animate-row" style="animation-delay: ${animDelay}s;">
                        <td class="pt-rank-col text-center">${idx + 1}</td>
                        <td class="pt-team-col col-team">${displayTeamName}</td>
                        <td class="text-center opacity-70 text-sm">${team.matches}</td>
                        <td class="text-center text-[#fcd34d]">${team.booyahs}</td>
                        <td class="text-center opacity-80">${team.pPts}</td>
                        <td class="text-center text-white font-bold">${team.elims}</td>
                        <td class="text-center"><span class="pt-total-col">${team.total}</span></td>
                    </tr>
                `;
            });
        }

        initOverlay();
    </script>
</body>
</html>
